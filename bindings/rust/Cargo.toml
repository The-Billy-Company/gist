# Standalone crate — deliberately EXCLUDED from the repo-root Cargo workspace
# (see `[workspace] exclude` in /Cargo.toml). Unlike the sibling C-ABI bindings
# (principia / lamina / billog) this crate links NO native archive: it is a
# subprocess transport over the certified `gist` binary (ADR-352), so it needs
# neither `make build-gist` nor `zig-out/`. It is standalone anyway so the whole
# `bindings/rust/` tree lifts out cleanly for the public OSS release with its own
# `Cargo.lock` + toolchain, never dragging the workspace graph along.
[package]
name = "gist"
version = "0.1.0"                                                                                                  # x-release-please-version
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false
description = "Importable, rg-parity search API over the GIST code-search kernel (subprocess transport, ADR-352)."

[lib]
name = "gist"

[dependencies]
# ripgrep's `--json` record stream is the wire format; serde is the idiomatic,
# ubiquitous parser for it. No other runtime dependency — the engine is a process.
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"

[dev-dependencies]
# The parity test reads the canonical `contract/search_api.toml` and asserts the
# crate's mirror matches it (the registry-as-contract drift gate).
toml = "1"
# Behavioral + rg-parity tests build a throwaway corpus.
tempfile = "3"

[lints.clippy]
pedantic = { level = "allow", priority = -1 }
