# Standalone crate — deliberately EXCLUDED from any parent Cargo workspace.
# By default it links NO native archive: it is a subprocess transport over the
# certified `gist` binary so it needs neither `zig build` nor `zig-out/`, and
# the whole `bindings/rust/` tree lifts out cleanly for the public OSS release
# with its own `Cargo.lock` + toolchain. The opt-in `native` feature is the
# graduation rung: it links `libgist` + `libirgx` and adds the in-process
# warm `Engine`/`Cursor` surface, still with the subprocess API intact beside it.
[workspace]

[package]
name = "gist"
version = "1.0.0"                                                                                                  # x-release-please-version
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "Importable, rg-parity search API over the GIST code-search kernel (subprocess transport by default)."

[lib]
name = "gist"

# `native` (opt-in) links libgist + libirgx and exposes the in-process
# pull-cursor `Engine`/`Cursor` surface; its `build.rs` resolves the libraries
# beside the kernel (or `$GIST_LIB_DIR`). Default stays a pure subprocess
# transport so the tree lifts out cleanly for the OSS release.
[features]
default = [  ]
native = [  ]

[dependencies]
# Shared substrate: contracts, row protocol, transports, typed failures.
# Path for in-tree development; once published, `cargo add gist` pulls the
# same version range of `irregex` from crates.io.
irregex = { version = "0.1.0", path = "../../../irregex/bindings/rust" }
# ripgrep's `--json` record stream is the wire format; serde is the idiomatic,
# ubiquitous parser for it. No other runtime dependency — the engine is a process.
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"

[dev-dependencies]
# Behavioral + rg-parity tests build a throwaway corpus.
tempfile = "3"

[lints.clippy]
pedantic = { level = "allow", priority = -1 }
