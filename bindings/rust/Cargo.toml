# Standalone crate — deliberately EXCLUDED from any parent Cargo workspace.
# By default it links NO native archive: it is a subprocess transport over the
# certified `gist` binary so it needs neither `zig build` nor `zig-out/`, and
# the whole `bindings/rust/` tree lifts out cleanly for the public OSS release
# with its own `Cargo.lock` + toolchain. The opt-in `native` feature is the
# graduation rung: it links `libgist` + `libirgx` and adds the in-process
# warm `Engine`/`Cursor` surface, still with the subprocess API intact beside it.
[workspace]

[package]
# `gist` on crates.io is an unrelated crate with real users, and crate names are
# permanent, so this takes the same `-search` name the PyPI distribution does.
# The `[lib]` below keeps the identifier callers actually type as `gist`.
name = "gist-search"
version = "1.2.5"                                                                                                                                # x-release-please-version
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Indexed code search for Rust - ripgrep-parity regex search over a persisted trigram index, with ranked definition-first results."
# The crates.io landing page is the repository's own README, not the short one
# beside these sources - crates.io shows a README as the whole project page, and
# a visitor who lands there has nowhere else to look. Cargo has no metadata hook,
# so `tools/registry_readme.py` mints a link-corrected copy here and this points
# at it. Regenerate immediately before `cargo package`, never earlier: a missing
# file fails loudly and a stale one would ship quietly, so absent is the safe
# state to leave it in. The file is gitignored, and `cargo build` never reads it.
readme = "PROJECT_README.md"
homepage = "https://github.com/The-Billy-Company/gist"
repository = "https://github.com/The-Billy-Company/gist"
documentation = "https://github.com/The-Billy-Company/gist/blob/main/bindings/rust/README.md"
authors = [ "The Billy Company" ]
# Five slots, and the crate name spends none of them: "gist" tells a searcher
# nothing about code search. So these are the job (code-search, grep, search)
# and the tool somebody is already holding when they come looking (ripgrep).
keywords = [ "code-search", "grep", "ripgrep", "regex", "search" ]
categories = [ "text-processing", "development-tools", "api-bindings", "algorithms" ]

# `LICENSE` and `NOTICE` are copies of the repository's, kept beside this manifest
# rather than referenced upward: Cargo cannot package a file outside the crate
# directory, so without the copies an Apache-2.0 crate shipped no license text and
# no attribution notice at all - the two things section 4 of that license requires a
# redistributor to hand on. Keep them byte-identical to the root pair.
#
# `rust-toolchain.toml` is deliberately not shipped. It pins 1.97.1 so this
# repository's contributors lint identically, which is no business of someone
# building the extracted crate - and it would silently override the 1.85
# `rust-version` above, which is the floor the sources actually ask for.
exclude = [ "/target", "/.cargo", "/rust-toolchain.toml" ]

# Load-bearing, not decorative: the package is `gist-search` on the index, so
# without this the library would be `gist_search` and every caller would have
# to type it. `use gist::…` is the API.
[lib]
name = "gist"

# `native` (opt-in) links libgist + libirgx and exposes the in-process
# pull-cursor `Engine`/`Cursor` surface; its `build.rs` resolves the libraries
# beside the kernel (or `$GIST_LIB_DIR`). Default stays a pure subprocess
# transport so the tree lifts out cleanly for the OSS release.
[features]
default = [  ]
native = [  ]

[dependencies]
# Shared substrate: contracts, row protocol, transports, typed failures.
# Path for in-tree development; a published build ignores it and resolves the
# same version range of `irgx` from crates.io.
irgx = { version = "2.0.0", path = "../../../irregex/bindings/rust" }
# ripgrep's `--json` record stream is the wire format; serde is the idiomatic,
# ubiquitous parser for it. No other runtime dependency — the engine is a process.
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"

[dev-dependencies]
# Behavioral + rg-parity tests build a throwaway corpus.
tempfile = "3"
# The contract parity gate reads `contract/surface.toml`. Dev-only: a consumer
# of this crate links no TOML parser.
toml = "1"

[lints.clippy]
pedantic = { level = "allow", priority = -1 }
