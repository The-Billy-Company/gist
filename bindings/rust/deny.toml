# cargo-deny config (schema v2 — cargo-deny ≥ 0.18)
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "0BSD",
]
# First-party crates in this repo are private and don't need license metadata.
private = { ignore = true }

[bans]
multiple-versions = "allow"
wildcards = "allow"

[[bans.deny]]
name = "native-tls"
reason = "Policy: rustls (ring) is the default TLS backend; native-tls and openssl-sys are banned."

[[bans.deny]]
name = "openssl-sys"
reason = "Policy: rustls (ring) is the default TLS backend; native-tls and openssl-sys are banned."

# Test-double policy: fakes over mocks. No mock framework enters the
# dependency graph — prefer in-process fakes with a parity suite that
# breaks on drift.
[[bans.deny]]
name = "mockall"
reason = "Fakes over mocks: use an in-process fake, not a generated mock framework."

[[bans.deny]]
name = "mockito"
reason = "Fakes over mocks: use an in-process HTTP fake, not a mock HTTP server crate."

[[bans.deny]]
name = "wiremock"
reason = "Fakes over mocks: use an in-process HTTP fake, not a mock HTTP server crate."

[sources]
unknown-registry = "warn"
unknown-git = "warn"
