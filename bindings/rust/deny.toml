# cargo-deny config (schema v2 — cargo-deny ≥ 0.18)
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "0BSD",
]
# First-party crates in this repo are private and don't need license metadata.
private = { ignore = true }

[bans]
multiple-versions = "allow"
wildcards = "allow"

[[bans.deny]]
name = "native-tls"
reason = "Workspace policy: rustls-ring is the default TLS backend (rust-services.mdc)."

[[bans.deny]]
name = "openssl-sys"
reason = "Workspace policy: rustls-ring is the default TLS backend (rust-services.mdc)."

[sources]
unknown-registry = "warn"
unknown-git = "warn"
