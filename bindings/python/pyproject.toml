# Importable Python face of gist search. Depends on the shared `irregex`
# substrate (row protocol, request types, shell/daemon/native transports).
# Local checkouts resolve the path editably; a published wheel depends on the
# PyPI `irregex` distribution. Runtime engine availability remains separate
# (GIST_BIN / PATH / in-repo zig-out).
#
# The floor tracks the `irregex` substrate's, since this package cannot import
# without it; PEP 695 syntax here makes 3.12 a parse-level requirement too.
# There is no upper bound: the monorepo this was extracted from pins one
# interpreter, but a published library has no business refusing 3.15.

[project]
name = "gist"
version = "0.1.0"                                                               # x-release-please-version
description = "Importable Python API for gist exact search."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "irregex",
]

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [ "gist" ]

[tool.uv.sources]
irregex = { path = "../../../irregex/bindings/python", editable = true }

[dependency-groups]
dev = [
  "pytest>=9.0",
  "ruff>=0.15",
  # Test-only, never a runtime dependency: the in-process tier is opportunistic
  # and fails open to the subprocess without it (see the header). In billy it
  # arrived transitively from the sibling cffi kernels; a standalone checkout has
  # no such sibling, so without this the whole FFI parity plane silently skips.
  "cffi>=1.17",
]

[tool.pytest.ini_options]
testpaths = [ "tests" ]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["gist", "irregex"]
