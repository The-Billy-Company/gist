# Importable Python face of gist search. Depends on the shared `irregex`
# substrate (row protocol, request types, shell/daemon/native transports).
# Local checkouts resolve the path editably; a published wheel depends on the
# PyPI `irregex` distribution.
#
# The wheel bundles its own `gist` CLI under `gist/bin/` (`hatch_build.py`,
# built per-platform by `scripts/build_wheels.py`) — a real `pip install
# gist-search` needs no separate `zig build` to satisfy the README's first
# example. `irgx.runtime.shell._resolve` still checks an explicit `GIST_BIN`
# override and a sibling dev checkout's `zig-out/bin/gist` FIRST, so a
# contributor's local build always wins over the packaged copy; PATH stays the
# final fallback for a `gist` installed some other way.
#
# The distribution is `gist-search` and the import stays `gist`: the plain
# `gist` name on PyPI belongs to an unrelated author, so `pip install gist`
# would fetch a stranger's package. Differing names is the bs4 / PIL / cv2
# pattern, and `[tool.hatch.build.targets.wheel] packages` keeps the shipped
# import name unchanged.
#
# The floor tracks the `irregex` substrate's, since this package cannot import
# without it; PEP 695 syntax here makes 3.12 a parse-level requirement too.
# There is no upper bound: the monorepo this was extracted from pins one
# interpreter, but a published library has no business refusing 3.15.

[project]
name = "gist-search"
version = "1.1.0"                                                                                                                                  # x-release-please-version
description = "Indexed code search for Python - ripgrep-parity regex search over a persisted trigram index, with ranked definition-first results."
# The long description is the repository's own README, lifted and link-corrected
# at build time by `hatch_readme.py`. PyPI opens onto the project's front door,
# not onto a second one kept beside this file.
dynamic = [ "readme" ]
requires-python = ">=3.12"
license = "Apache-2.0"
# Copies of the repository's pair, kept beside this manifest because a build backend
# packages nothing from above the project directory. Without them the wheel carried an
# SPDX expression and no licence text - and no NOTICE, which section 4 of Apache-2.0
# requires a redistributor to hand on. Named here rather than left to the sdist so
# they land in the wheel's `.dist-info/licenses/` too. Keep byte-identical to the root.
license-files = [ "LICENSE", "NOTICE" ]
authors = [ { name = "The Billy Company" } ]
# The distribution name is `gist-search` because the bare one was taken, which
# means the name alone does no discovery work - nobody types "gist" looking for
# a code searcher. These keywords carry the whole load: the job (code search,
# grep, find in files), the mechanism (trigram index, indexed search), and the
# tools somebody is already using when they come looking (ripgrep, ack, ag,
# codesearch, zoekt).
keywords = [
  "code-search",
  "codesearch",
  "grep",
  "ripgrep",
  "rg",
  "ack",
  "ag",
  "silver-searcher",
  "zoekt",
  "regex",
  "regexp",
  "search",
  "text-search",
  "source-code-search",
  "find-in-files",
  "trigram",
  "trigram-index",
  "indexed-search",
  "full-text-search",
  "cli",
  "developer-tools",
  "static-analysis",
  "code-navigation",
  "agent-tools",
  "pattern-matching",
]
dependencies = [
  # Bounded on both sides, and neither bound is boilerplate. `irgx` is the import
  # this package opens with, and it only exists from 1.0.0 — the 0.1.0 already on
  # the index is the pre-rename placeholder, so an unbounded requirement resolved
  # to a distribution that cannot satisfy a single line of this one. The floor is
  # 2.0.0, not 1.0.0, because that is the release where `_resolve` learned its
  # fourth rung — a binary a product's own wheel bundled at `<name>/bin/<name>` —
  # and this package's whole reason to bundle a `gist` binary at all depends on
  # the shared resolver knowing to look for it there (the fourth-rung commit
  # landed the same release cycle as an unrelated ABI-growing `feat!:`, so the
  # tag that actually ships it is 2.0.0, not the 1.1.0 an isolated feature bump
  # would have produced). Below that floor, a fresh `pip install gist-search`
  # would carry the CLI and never find it. The ceiling holds the other half of
  # the same shape: this package imports `irgx.contract`, `irgx.request`, and
  # `irgx.runtime` directly, so a THIRD major (whatever next moves that surface)
  # is not accepted sight-unseen — `bindings/python/tests/` running clean
  # against 2.x is what earns 2.x its place here, not a guess about semver.
  "irregex>=2.0.0,<3",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Zig",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing",
  "Topic :: Text Processing :: Indexing",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/The-Billy-Company/gist"
Documentation = "https://github.com/The-Billy-Company/gist#readme"
Repository = "https://github.com/The-Billy-Company/gist"
Issues = "https://github.com/The-Billy-Company/gist/issues"
Changelog = "https://github.com/The-Billy-Company/gist/blob/main/CHANGELOG.md"

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "hatch_readme.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_readme.py"

[tool.hatch.build.targets.wheel]
packages = [ "gist" ]
# Populated by `hatch_build.py` (`gist/bin/gist[.exe]`) — not a source path,
# hence not one of `packages` above, but an inclusion the wheel target has to
# declare before the custom hook's `force_include` can add to it.
artifacts = [ "gist/bin/*" ]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.uv.sources]
irregex = { path = "../../../irregex/bindings/python", editable = true }

[dependency-groups]
dev = [
  "pytest>=9.0",
  "ruff>=0.15",
  # The build backend, here because `test_description.py` drives the metadata
  # hook that decides what PyPI shows.
  "hatchling>=1.27",
  # Test-only, never a runtime dependency: the in-process tier is opportunistic
  # and fails open to the subprocess without it (see the header). In the
  # originating monorepo it arrived transitively from the sibling cffi kernels; a
  # standalone checkout has no such sibling, so without this the whole FFI parity
  # plane silently skips.
  "cffi>=1.17",
]

[tool.pytest.ini_options]
testpaths = [ "tests" ]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B", "SIM" ]
ignore = [ "E501" ]

[tool.ruff.lint.isort]
known-first-party = [ "gist", "irgx" ]
