# Importable Python face of GIST (ADR-352). Zero REQUIRED runtime dependencies:
# the default transport is a pure-Python wrapper over the certified `gist`
# binary + `--json` (resolved at call time — env `GIST_BIN`, PATH, or the repo's
# `zig-out/bin/gist`; `make install-gist` builds it). The persistent `Session`
# additionally OPPORTUNISTICALLY uses an in-process cffi transport (ADR-352
# rung 3, `gist/_ffi.py` over `libirregex.{dylib,so}`) when BOTH `cffi` and the
# built shared library are present in the host process — e.g. the AI service,
# which already depends on `cffi` via the sibling kernels. `cffi` is never
# required: `_ffi` fails open to the subprocess when it (or the library) is
# absent, so the shipped wheel stays pure-Python and dependency-free.
#
# Root uv workspace member: local consumers resolve this source editably.
# Runtime engine availability remains separate (GIST_BIN/PATH/in-repo build).

[project]
name = "billy-gist"
version = "0.1.0"                                                                                 # x-release-please-version
description = "Importable search API over GIST — Billy's rg-parity code-search kernel (ADR-352)."
requires-python = ">=3.14,<3.15"
dependencies = [  ]

[project.scripts]
# Convenience shim mirroring the CLI; `python -m gist` also works.

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [ "gist" ]

[dependency-groups]
dev = [
  "pytest>=9.0",
  "ruff>=0.15",
  # Test-only: the doc_radar canary replays the radar's real YAML frontmatter
  # corpus (still_here pins) through both engines. doc_radar itself uses PyYAML;
  # the shipped package stays pure-Python / zero-dependency.
  "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = [ "tests" ]

# Inherits select / line-length / isort / per-file-ignores from the root.
[tool.ruff]
extend = "../../../../../pyproject.toml"
