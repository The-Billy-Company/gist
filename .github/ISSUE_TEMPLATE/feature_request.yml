name: Feature request
description: Something the tool should be able to do and cannot.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >
        Two lanes exist here on purpose. The **muscle-memory lane** is
        ripgrep's, and the bar for changing anything in it is very high - the
        whole point is that a search you already know how to type keeps
        working. The **native lane** is for an intent ripgrep does not name,
        and that is where new surface belongs.


        So the useful version of this request answers: which lane, and why
        can't the other one already do it?

  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: >-
        The question you are asking of a codebase, not the flag you have in
        mind. Half the good ideas here started as somebody describing a search
        they gave up on.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: What you do instead today
      description: >-
        The pipeline you assemble, the second tool you reach for, the loop you
        write. This is the strongest evidence a request has.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: >-
        A flag, a verb, an output shape. Rough is fine. If you know what it
        should do at the edges - no matches, a pipe instead of a terminal,
        `--json`, an empty corpus - say it, because that is where the design
        work actually is.

  - type: dropdown
    id: lane
    attributes:
      label: Which lane is this?
      options:
        - Native - an intent ripgrep does not have a name for
        - Muscle-memory - ripgrep has this and gist should match it
        - Not sure
    validations:
      required: true

  - type: input
    id: prior_art
    attributes:
      label: Who already does this?
      description: >-
        ripgrep, csearch, zoekt, ag, an editor, a paper. Not a
        disqualification - the opposite. Knowing that someone solved it, and
        how, is where a good design starts, and we would rather adopt a good
        idea with credit than reinvent a worse one.
