# Publish the wheel matrix to PyPI when a version tag is pushed.
#
# Runs the `build` job on macOS, mirroring `irregex/.github/workflows/release.yml`:
# Zig cross-compiles all six targets from one machine in about a minute, no CI
# fan-out and no emulation needed to *produce* the artifacts. But producing a
# cross-compiled executable is not the same claim as running one, and this
# project ships a binary a subprocess actually execs — an ELF that loads on
# nothing, or a Windows PE with the wrong calling convention, would build
# cleanly here and fail on every user's machine. So `smoke` follows `build`
# with one job per target, each on the real GitHub-hosted runner for that OS
# and architecture, installing the just-built wheel and running an authentic
# search through it — the thing `import gist` alone cannot prove.
#
# Wheels only, no sdist. The Python project lives under `bindings/python` while
# the engine sources live at the repository root, so an sdist rooted at the
# project would not contain the thing it needs to build — the same reason
# `irregex` ships none. Six wheels cover every platform anyone is installing
# on; shipping a source archive that cannot build itself would be worse than
# shipping none.
#
# ONE-TIME SETUP: this uses PyPI Trusted Publishing, so there is no API token to
# rotate or leak. On PyPI, add a trusted publisher for the `gist-search` project
# pointing at this repository, workflow `release.yml`, environment `pypi`.
name: release

on:
  push:
    tags: ["v*"]
  # Buildable and verifiable without publishing, so the matrix — and the
  # native smoke tests — can be exercised without minting a version.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A second tag run must wait; cancelling midway can strand a partial release.
  cancel-in-progress: false

jobs:
  # The shared release contract (`release.toml` + the org's `package-release`
  # action), run once before anything is built: is the tag the version
  # `build.zig.zon` and every mirror declare, is the changelog folded with
  # the exact `## [X.Y.Z]` heading and no fragment left un-folded, did
  # `release-ready` go green on this exact commit, and is this commit
  # actually reachable from `main`? The search family also releases in a
  # fixed order — `irregex` before `gist`/`relate`, both before `blast` — so
  # this additionally probes that this package's declared floor of
  # `irregex` is already on the registries it depends on, rather than
  # discovering the gap when the built wheel's floor-install step 404s.
  # Every step below is conditioned on an actual tag, so a `workflow_dispatch`
  # dry run (no tag) passes through as a no-op and `build` still runs
  # unpublished.
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: The-Billy-Company/.github/actions/package-release@18530e6f8b7ad634dcfe52e423e2a0a8e7bd521e # main
        with:
          command: version
          args: --root . --tag ${{ github.ref_name }}
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: The-Billy-Company/.github/actions/package-release@18530e6f8b7ad634dcfe52e423e2a0a8e7bd521e # main
        with:
          command: changelog
          args: >-
            --root . --require-fragments-empty
            --version ${{ fromJSON(steps.version.outputs.result).version }}
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: The-Billy-Company/.github/actions/package-release@18530e6f8b7ad634dcfe52e423e2a0a8e7bd521e # main
        with:
          command: tag-ancestor
          args: ${{ github.repository }} ${{ github.sha }} --branch main
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: The-Billy-Company/.github/actions/package-release@18530e6f8b7ad634dcfe52e423e2a0a8e7bd521e # main
        with:
          command: ci-status
          args: ${{ github.repository }} ${{ github.sha }}

      - name: Read the declared irregex floor
        if: startsWith(github.ref, 'refs/tags/v')
        id: dep
        run: |
          set -euo pipefail
          floor=$(python3 -c "
          import re
          text = open('bindings/python/pyproject.toml').read()
          print(re.search(r'\"irregex>=([0-9.]+)', text)[1])")
          echo "irregex_floor=$floor" >> "$GITHUB_OUTPUT"
      - if: startsWith(github.ref, 'refs/tags/v')
        id: dep-pypi
        uses: The-Billy-Company/.github/actions/package-release@18530e6f8b7ad634dcfe52e423e2a0a8e7bd521e # main
        with:
          command: registry-probe
          args: pypi irregex ${{ steps.dep.outputs.irregex_floor }}
      - if: startsWith(github.ref, 'refs/tags/v')
        id: dep-crates
        uses: The-Billy-Company/.github/actions/package-release@18530e6f8b7ad634dcfe52e423e2a0a8e7bd521e # main
        with:
          command: registry-probe
          args: crates irgx ${{ steps.dep.outputs.irregex_floor }}
      - name: irregex's declared floor must already be published
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PYPI: ${{ steps.dep-pypi.outputs.result }}
          CRATES: ${{ steps.dep-crates.outputs.result }}
          FLOOR: ${{ steps.dep.outputs.irregex_floor }}
        run: |
          set -euo pipefail
          if [ "$PYPI" != present ] || [ "$CRATES" != present ]; then
            echo "::error::irregex $FLOOR is not yet published (pypi: $PYPI, crates: $CRATES)." \
                 "The search family releases in order — irregex before gist — so publish" \
                 "irregex first." >&2
            exit 1
          fi
          echo "irregex $FLOOR is on both registries"

  build:
    name: build
    needs: preflight
    runs-on: macos-latest
    defaults:
      run:
        working-directory: gist/bindings/python
    steps:
      # `build.zig.zon` resolves `irregex` as a sibling path dependency
      # (`../irregex`), and `Cargo.toml`/`pyproject.toml` do the same for their
      # own bindings — so both repositories are checked out into subdirectories
      # of the workspace, making them siblings of each other exactly as they are
      # in a real clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gist
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: The-Billy-Company/irregex
          path: irregex
          token: ${{ secrets.ECOSYSTEM_TOKEN || github.token }}
          persist-credentials: false
      # Both setups cache by default, and a cache is writable by any workflow on
      # any branch. That is a fine trade for CI, where a poisoned entry costs a
      # confusing red X; it is the wrong trade here, where the artifact this job
      # builds gets signed and published. A release builds from source or not
      # at all.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      # `preflight` already re-verified this against every mirror; the shared
      # action reads it the same way here so this job's own artifact never
      # disagrees with what preflight just approved.
      # `--root` is resolved against $GITHUB_WORKSPACE, not this job's
      # `working-directory` default (that key only reaches `run:` steps, never
      # a `uses:` composite action) — so it has to name `gist` explicitly now
      # that the workspace root holds both checkouts as siblings.
      - name: The tag must name the version being published
        if: startsWith(github.ref, 'refs/tags/v')
        uses: The-Billy-Company/.github/actions/package-release@18530e6f8b7ad634dcfe52e423e2a0a8e7bd521e # main
        with:
          command: version
          args: --root gist --tag ${{ github.ref_name }}

      - name: Build every target
        run: uv run --no-project --python 3.12 python scripts/build_wheels.py

      # A local checkout resolves `irregex` through a `[tool.uv.sources]` path,
      # which is right for development — but that key is uv-specific and never
      # reaches core metadata, so what actually ships is whatever `Requires-Dist`
      # ended up saying. Assert on a built artifact rather than on the source,
      # because the source entry is supposed to be there and a release cannot be
      # taken back. Any one of the six wheels answers identically: the
      # dependency declaration does not vary by platform.
      #
      # "Names irregex" was the whole assertion once, and it passed while the
      # requirement was a bare `irregex` — which the resolver satisfied with the
      # 0.1.0 pre-rename placeholder, a distribution with no `irgx` module in it
      # at all. The floor gate below caught the import error, but only because
      # that older version happens to exist; an unbounded requirement is wrong
      # whether or not the index currently holds something old enough to prove it.
      # So the lower bound is asserted here, where a release can still be stopped.
      - name: The published dependency must resolve from the index
        run: |
          set -euo pipefail
          uv run --no-project --python 3.12 --with packaging==25.0 python - <<'PY'
          import pathlib, re, sys, zipfile
          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name
          whl = next(pathlib.Path("dist").glob("*.whl"))
          zf = zipfile.ZipFile(whl)
          name = next(n for n in zf.namelist() if n.endswith(".dist-info/METADATA"))
          text = zf.read(name).decode()
          lines = re.findall(r"^Requires-Dist:\s*(.+)$", text, re.M)
          print("Requires-Dist:", lines or "(none)")
          # `packaging` rather than string surgery, because a requirement's own
          # grammar is what the index reads. Splitting on whitespace found the name
          # only while the requirement carried no specifier: `irregex<2,>=1.0.0` has
          # no space in it, so the moment a bound was added the name stopped
          # matching and the gate reported the dependency missing.
          reqs = [Requirement(line) for line in lines]
          substrate = [r for r in reqs if canonicalize_name(r.name) == "irregex"]
          if not substrate:
              sys.exit("the wheel does not depend on irregex — the substrate would be missing")
          if direct := [str(r) for r in reqs if r.url]:
              sys.exit(f"a direct/path reference would ship: {direct}")
          floors = {">=", "==", "~=", ">"}
          if not any(s.operator in floors for r in substrate for s in r.specifier):
              sys.exit(f"the substrate requirement has no lower bound, so a pre-rename "
                       f"release can satisfy it: {[str(r) for r in substrate]}")
          print("dependency metadata is index-resolvable and bounded")
          PY

      # Fails fast, on the build host, before the six-way native matrix below
      # spends its minutes: installs the macOS-arm64 wheel this host is native
      # for and runs a real search, not just an import. `smoke` repeats this on
      # every other target's own hardware.
      - name: Prove a real search on the build host's own wheel
        run: |
          set -euo pipefail
          uv venv --python 3.12 /tmp/floor
          uv pip install --python /tmp/floor/bin/python --find-links dist gist-search
          mkdir -p /tmp/floor-corpus
          printf 'def unique_marker_fn_8f3a():\n    return 42\n' > /tmp/floor-corpus/needle.py
          # From a directory that is not the project, so the import resolves to
          # the installed wheel rather than the working copy beside it.
          cd /tmp && /tmp/floor/bin/python -c "
          import gist, subprocess
          matches = gist.search(r'unique_marker_fn_8f3a', cwd='/tmp/floor-corpus')
          assert len(matches) == 1, matches
          assert matches[0].line_number == 1, matches[0]
          subprocess.run([gist.binary(), '--version'], check=True)
          print('floor import + real search + raw CLI exec OK:', gist.binary())
          "

      - name: Check the metadata the index will read
        run: uvx twine check dist/*.whl

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels
          path: gist/bindings/python/dist/*.whl
          if-no-files-found: error

  # Import success is not product success. Each of these runs on the real
  # architecture its target names — not QEMU, not Rosetta — and installs
  # *only* the one wheel `pip`'s own tag matching picks out of the six in
  # `dist/`, then drives a real search through the bundled binary with no
  # `PATH`/`GIST_BIN` override and no source checkout for `_resolve`'s
  # checkout-local rung to find. If tag matching ever put the wrong wheel on a
  # host, or a cross-compiled binary refused to load on its own kernel, this is
  # where that surfaces — not in a bug report.
  smoke:
    name: smoke (${{ matrix.target }})
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-arm64, runner: macos-latest }
          - { target: macos-x86_64, runner: macos-15-intel }
          - { target: linux-x86_64, runner: ubuntu-latest }
          - { target: linux-aarch64, runner: ubuntu-24.04-arm }
          - { target: windows-x86_64, runner: windows-2025 }
          - { target: windows-arm64, runner: windows-11-arm }
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheels
          path: dist
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      # `shell: bash` on every OS (Windows runners ship Git Bash) so one script
      # covers all six targets; the venv's own layout (`bin/` vs `Scripts/`) is
      # the only thing that still forks.
      - name: Install the wheel pip's tag matching picks for this host
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python 3.12 .smoke
          py=.smoke/bin/python
          [ -f "$py" ] || py=.smoke/Scripts/python.exe
          echo "py=$py" >> "$GITHUB_ENV"
          # No --no-index: gist-search's own wheel comes from ./dist (the
          # candidate about to be published), irregex resolves from the real
          # PyPI index — the dependency a real `pip install gist-search` gets.
          uv pip install --python "$py" --find-links dist gist-search
          "$py" -c "
          import gist, pathlib, sys
          print('installed from wheel; resolved binary:', gist.binary())
          assert pathlib.Path(gist.binary()).is_file(), 'resolved path does not exist'
          "

      - name: Run a real search through the bundled binary — no PATH, no GIST_BIN
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p corpus
          printf 'def unique_marker_fn_8f3a():\n    return 42\n' > corpus/needle.py
          "$py" -c "
          import subprocess
          import gist

          matches = gist.search(r'unique_marker_fn_8f3a', cwd='corpus')
          assert len(matches) == 1, f'expected 1 match, got {matches!r}'
          assert matches[0].line_number == 1, matches[0]
          assert 'unique_marker_fn_8f3a' in matches[0].text, matches[0]

          no_hits = gist.search(r'no_such_pattern_anywhere_zz9', cwd='corpus')
          assert no_hits == [], f'a pattern absent from the corpus matched: {no_hits!r}'

          # The raw executable, invoked directly — proves the cross-compiled
          # binary itself loads and runs on this kernel, independent of the
          # Python subprocess wrapper around it.
          proc = subprocess.run([gist.binary(), '--version'], capture_output=True, text=True, check=True)
          print('real search + raw CLI exec OK:', gist.version(), proc.stdout.strip() or proc.stderr.strip())
          "

  publish:
    name: publish
    # Only a tag publishes. A manual run builds and verifies and stops there.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [preflight, build, smoke]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # The OIDC token Trusted Publishing exchanges for an upload credential.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheels
          path: dist
      - id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # Probed before the OIDC token is minted, the same idempotency the
      # `crates` job proves below: a retry after a flake, or a dispatch on a
      # tag that already shipped, must land on "already there" rather than
      # spend a credential on an upload PyPI will reject anyway.
      - id: probe
        uses: The-Billy-Company/.github/actions/package-release@18530e6f8b7ad634dcfe52e423e2a0a8e7bd521e # main
        with:
          command: registry-probe
          args: pypi gist-search ${{ steps.tag.outputs.version }}
      - name: probe answered
        env:
          STATE: ${{ steps.probe.outputs.result }}
          STEPS_TAG_OUTPUTS_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$STATE" = error ]; then
            echo "::error::PyPI did not answer for gist-search ${STEPS_TAG_OUTPUTS_VERSION} —" \
                 "a network failure is never treated as \"absent\"." >&2
            exit 1
          fi
          echo "gist-search ${STEPS_TAG_OUTPUTS_VERSION} on PyPI: $STATE"
      - if: steps.probe.outputs.result == 'absent'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  # ── crates.io
  #
  # A sibling of `publish`, not a step inside it. The two registries fail
  # independently, and a wheel that already uploaded must not be rolled back
  # because a crate upload failed — nor the reverse. Each gates on the same tag
  # and reads the same version, so they cannot disagree about what they publish.
  #
  # ONE-TIME SETUP: crates.io Trusted Publishing, so there is no registry token
  # to rotate or leak. On crates.io, add a trusted publisher to this crate
  # pointing at this repository, workflow `release.yml`, environment `crates-io`.
  # The first version had to be published by hand with an API token; crates.io
  # requires a crate to exist before it will accept a publisher configuration.
  crates:
    name: crates
    if: startsWith(github.ref, 'refs/tags/v')
    needs: preflight
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write # crates.io exchanges this OIDC token for a short-lived registry token.
    defaults:
      run:
        working-directory: gist/bindings/rust
    steps:
      # `Cargo.toml` resolves `irgx` as a sibling path dependency
      # (`../../irregex/bindings/rust`), so both repositories are checked out
      # into subdirectories of the workspace, making them siblings of each
      # other exactly as they are in a real clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gist
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: The-Billy-Company/irregex
          path: irregex
          token: ${{ secrets.ECOSYSTEM_TOKEN || github.token }}
          persist-credentials: false

      # `preflight` already re-verified this against every mirror; reading it
      # the same way here means this job's own artifact never disagrees with
      # what preflight just approved. `--root` is resolved against
      # $GITHUB_WORKSPACE, not this job's `working-directory` default (that key
      # only reaches `run:` steps, never a `uses:` composite action), so it has
      # to name `gist` explicitly now that the workspace root holds both
      # checkouts as siblings.
      - name: The tag must name the version being published
        uses: The-Billy-Company/.github/actions/package-release@18530e6f8b7ad634dcfe52e423e2a0a8e7bd521e # main
        with:
          command: version
          args: --root gist --tag ${{ github.ref_name }}

      # crates.io renders a README as the entire project page, so the one it gets
      # is a link-corrected copy of the repository README rather than the short
      # one beside these sources. It is gitignored and minted here, immediately
      # before publishing: absent fails loudly, stale would ship quietly.
      - name: Mint the registry landing page
        working-directory: gist
        run: python3 tools/registry_readme.py

      # Idempotent, for the same reason the Go tag step is, and probed before
      # the OIDC token below is minted: re-running a release — a retry after a
      # flake, or a dispatch on an existing tag — must not fail because the
      # version is already on the index. A published version is immutable
      # there, so "already present" is success, not a collision, and a
      # registry that does not answer is never treated as "absent."
      - id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: state
        uses: The-Billy-Company/.github/actions/package-release@18530e6f8b7ad634dcfe52e423e2a0a8e7bd521e # main
        with:
          command: registry-probe
          args: crates gist ${{ steps.tag.outputs.version }}
      - name: probe answered
        env:
          STATE: ${{ steps.state.outputs.result }}
          STEPS_TAG_OUTPUTS_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$STATE" = error ]; then
            echo "::error::crates.io did not answer for gist ${STEPS_TAG_OUTPUTS_VERSION} —" \
                 "a network failure is never treated as \"absent\"." >&2
            exit 1
          fi
          echo "gist ${STEPS_TAG_OUTPUTS_VERSION} on crates.io: $STATE"

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: steps.state.outputs.result == 'absent'
        id: auth

      # --locked: publish the dependency graph that was tested, not whatever the
      # index happens to offer at upload time.
      - if: steps.state.outputs.result == 'absent'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
  # ── Go module
  #
  # There is no registry to upload to: the proxy reads tags straight from the
  # repository. But a module in a subdirectory is resolved by a
  # subdirectory-prefixed tag, so `v1.2.3` publishes nothing for `bindings/go`
  # and `bindings/go/v1.2.3` publishes everything. The release that pushes the
  # first tag pushes the second, because a second tag typed by hand is the step
  # that gets forgotten.
  #
  # The App token is required rather than preferred: the enterprise blocks the
  # Actions identity from the writes this needs, and the same App already signs
  # the release PR.
  go-module:
    name: go-module
    if: startsWith(github.ref, 'refs/tags/v')
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read # The tag is cut with the App token below, not with GITHUB_TOKEN.
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      # No checkout. The tag is created through the API, so there is no clone to
      # make, no full history to fetch, and no credential written into a
      # `.git/config` that a later step could package up. The commit is
      # `github.sha`, which is the commit the version tag already names.
      - name: Tag the Go module at this commit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          GO_TAG: bindings/go/${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Idempotent, and judged on module content rather than on the commit.
          # What the proxy publishes is the `bindings/go` subtree, so two commits
          # with an identical subtree are the same module — a re-run, or a version
          # tag cut a few commits after the Go tag, is a no-op rather than a
          # collision. A subtree that actually differs is the real hazard: the
          # proxy has already served those bytes under this version and will never
          # serve different ones, so moving the tag would publish a lie.
          if ref=$(gh api "repos/$REPO/git/ref/tags/$GO_TAG" 2>/dev/null); then
            # An annotated tag's ref names the tag object, which has to be
            # dereferenced to reach the commit it wraps.
            kind=$(printf '%s' "$ref" | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["type"])')
            obj=$(printf '%s' "$ref" | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')
            if [ "$kind" = "tag" ]; then
              commit=$(gh api "repos/$REPO/git/tags/$obj" --jq '.object.sha')
            else
              commit=$obj
            fi
            before=$(gh api "repos/$REPO/git/trees/$commit:bindings/go" --jq '.sha')
            now=$(gh api "repos/$REPO/git/trees/$SHA:bindings/go" --jq '.sha')
            if [ "$before" = "$now" ]; then
              echo "$GO_TAG already publishes this exact module ($now); nothing to do"
              exit 0
            fi
            echo "::error::$GO_TAG already exists and publishes a different" \
                 "bindings/go ($before, not $now). A published Go version is" \
                 "immutable in the proxy; cut a new version rather than moving" \
                 "the tag." >&2
            exit 1
          fi
          # Annotated, in two calls: the object carries the message, the ref makes
          # it visible. A lightweight ref alone would lose the note entirely.
          obj=$(gh api "repos/$REPO/git/tags" -f tag="$GO_TAG" -f object="$SHA" \
                  -f type=commit -f "message=Go module $GITHUB_REF_NAME

          The module lives in a subdirectory, so the proxy resolves it by a
          subdirectory-prefixed tag rather than the repository's own version tag." \
                --jq '.sha')
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$GO_TAG" -f sha="$obj" --jq '.ref'
          echo "created $GO_TAG at $SHA"

      # The proxy ingests a version on first request, so asking for it here means
      # the first real `go get` is a cache hit rather than the request that pays
      # for ingestion — and a failure here is a loud signal that the tag did not
      # produce a usable module.
      - name: Prove the proxy can serve it
        env:
          MODULE: github.com/${{ github.repository }}/bindings/go
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if GOFLAGS='' go list -m "$MODULE@$VERSION"; then
              echo "proxy serves $MODULE@$VERSION"
              exit 0
            fi
            echo "not visible yet (attempt $attempt); waiting"
            sleep 15
          done
          echo "::error::$MODULE@$VERSION never became resolvable through the" \
               "module proxy. The tag exists, so this is an ingestion problem." >&2
          exit 1

  # Give the GitHub Release the notes this repository actually wrote.
  #
  # release-please composes the release body itself, off conventional-commit
  # subjects filtered through `changelog-sections` — a separate path from the
  # `skip-changelog` that hands CHANGELOG.md to towncrier. So the page people
  # land on is assembled from commit subjects while the notes someone wrote sit
  # in the changelog, and nothing joined them: irregex v2.1.1 published two
  # lines against a folded section of a hundred and ten, because eleven of its
  # thirteen commits were `ci:` or `docs:` and both are `hidden`. This posts the
  # folded `## [X.Y.Z]` section over that body.
  #
  # Deliberately not `needs: preflight`: preflight's last step waits up to an
  # hour for `release-ready` on this commit, and the release page should read
  # correctly within a minute of the tag rather than after the publish gate
  # clears. Nothing here ships an artifact, so it does not need that gate — and
  # if the section is missing this fails loudly, leaving the release with the
  # thin body it was born with rather than a wrong one.
  notes:
    name: release notes
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # `gh release edit`, on a release this repository owns
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: The-Billy-Company/.github/actions/package-release@18530e6f8b7ad634dcfe52e423e2a0a8e7bd521e # main
        with:
          command: notes
          args: >-
            --root . --version ${{ github.ref_name }}
            --out /tmp/release-notes.md --repo ${{ github.repository }}

      # The release usually exists before this workflow starts — release-please
      # creates it through the API, and creating it is what puts the tag on the
      # remote that triggered this run. Usually is not always: a tag pushed any
      # other way arrives with no release behind it, and editing one that does
      # not exist fails on a tag that is already immutable. So wait for it,
      # bounded, rather than assuming the ordering holds.
      - name: Post the folded section over the generated body
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if gh release view "$TAG" --json id >/dev/null 2>&1; then
              gh release edit "$TAG" --notes-file /tmp/release-notes.md
              echo "posted $(wc -c < /tmp/release-notes.md) bytes to the $TAG release"
              exit 0
            fi
            echo "no release on $TAG yet (attempt $attempt/30) — waiting"
            sleep 10
          done
          echo "::error::no GitHub Release on $TAG after five minutes — its body" \
               "was left as generated. Post it by hand with \`gh release edit\`" \
               "and the section from CHANGELOG.md." >&2
          exit 1
