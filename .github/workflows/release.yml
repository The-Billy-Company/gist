# Publish the Python distribution to PyPI when a version tag is pushed.
#
# Deliberately much smaller than the sibling `irregex` release. That package
# carries a compiled engine and needs a five-target wheel matrix; this one is
# pure Python and depends on `irregex` for every native byte it touches. So one
# `py3-none-any` wheel covers every platform, and — unlike the sibling — an
# sdist is genuinely buildable, because this project is self-contained under
# `bindings/python` rather than rooted above its own sources.
#
# The distribution is `gist-search`; the import stays `gist`. The plain `gist`
# name on PyPI belongs to an unrelated author, so publishing under it is not
# available and installing under it would fetch a stranger's package. Naming
# them differently is the bs4 / PIL / cv2 pattern.
#
# ONE-TIME SETUP: this uses PyPI Trusted Publishing, so there is no API token to
# rotate or leak. On PyPI, add a trusted publisher for the `gist-search` project
# pointing at this repository, workflow `release.yml`, environment `pypi`.
name: release

on:
  push:
    tags: ["v*"]
  # Buildable and verifiable without publishing, so the artifact can be
  # exercised without minting a version.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # Every face starts at 1.0.0 together — that is the release where the
      # C ABI is frozen, so it would read badly for the thing being frozen to
      # carry a different number than the thing promising it. They diverge from
      # there: a binding's API churn has no business bumping the engine. So the
      # numbers being equal today is a starting line, not a coupling, and this
      # workflow publishes exactly one of them — the tag has to name that one's
      # version or the release notes describe an artifact nobody got.
      - name: The tag must name the version being published
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          declared=$(uv run --python 3.12 python -c \
            "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag v$tag would publish gist-search $declared." \
                 "Tag the distribution's version, or bump pyproject.toml." >&2
            exit 1
          fi
          echo "tag v$tag matches the declared version"

      - name: Build sdist + wheel
        run: uv build --out-dir dist

      # A local checkout resolves `irregex` through a `[tool.uv.sources]` path,
      # which is right for development — but that key is uv-specific and never
      # reaches core metadata, so what actually ships is whatever `Requires-Dist`
      # ended up saying. Assert on the built artifact rather than on the source,
      # because the source entry is supposed to be there and a release cannot be
      # taken back.
      - name: The published dependency must resolve from the index
        run: |
          set -euo pipefail
          uv run --python 3.12 python - <<'PY'
          import pathlib, re, sys, zipfile
          whl = next(pathlib.Path("dist").glob("*.whl"))
          zf = zipfile.ZipFile(whl)
          name = next(n for n in zf.namelist() if n.endswith(".dist-info/METADATA"))
          text = zf.read(name).decode()
          reqs = re.findall(r"^Requires-Dist:\s*(.+)$", text, re.M)
          print("Requires-Dist:", reqs or "(none)")
          if not any(r.split()[0].split("[")[0].strip() == "irregex" for r in reqs):
              sys.exit("the wheel does not depend on irregex — the substrate would be missing")
          bad = [r for r in reqs if "@" in r or "file://" in r]
          if bad:
              sys.exit(f"a direct/path reference would ship: {bad}")
          print("dependency metadata is index-resolvable")
          PY

      # The gate that earns its place: install the built artifact on the declared
      # floor, from the index for its dependencies, and prove it imports. A
      # `requires-python` that is a guess installs cleanly and then fails at
      # import, which is the worst possible place to find out.
      - name: Prove the declared floor on the built artifact
        run: |
          set -euo pipefail
          uv venv --python 3.12 /tmp/floor
          uv pip install --python /tmp/floor/bin/python --find-links dist gist-search
          # From a directory that is not the project, so the import resolves to
          # the installed wheel rather than the working copy beside it.
          cd /tmp && /tmp/floor/bin/python -c "
          import gist
          print('floor import OK:', gist.__name__)
          "

      - name: Check the metadata the index will read
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: bindings/python/dist/*
          if-no-files-found: error

  publish:
    # Only a tag publishes. A manual run builds and verifies and stops there.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # The OIDC token Trusted Publishing exchanges for an upload credential.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
