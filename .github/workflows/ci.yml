# What has to be true before a change lands.
#
# Four faces plus five discipline gates, nine jobs, deliberately not one: a
# Zig engine regression and a Rust clippy nit are different news, and a single
# job would report them as the same red X.
#
# Unlike the substrate underneath it, this package cannot build from its own
# clone, and the four build jobs here pay for that in the same way. The five
# gates below - `discipline`, `fmt`, `certificate`, `version`, `changelog` - do
# not, and each says so with a bare checkout. They read repository files rather
# than configuring a build, so no sibling has to resolve for them. `build.zig.zon`
# resolves `irregex` as a sibling path dependency, and so do all three bindings
# independently — the Go `replace`, the uv source, and the Rust path dep each
# spell `../../../irregex/...`. `actions/checkout` refuses a `path:` outside the
# workspace, so `path: ../irregex` is not available; instead BOTH repositories
# are checked out into subdirectories of the workspace, which makes them
# siblings of each other and every one of those relative paths resolve as
# written.
# Nothing in the package is patched for CI, which is the point: what builds here
# is the layout a contributor actually clones.
#
# The sibling is taken at its default branch rather than a pinned commit,
# because a path dependency has no pin to honor — a release pins url+hash
# through the publish script, and that is a different artifact than this gate.
# The default `GITHUB_TOKEN` is enough to read it while it is public; were it
# ever made private, every one of these checkouts would need a token with
# access to it instead.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A force-push mid-run should cancel the run it obsoleted, not race it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Matches `minimum_zig_version` in build.zig.zon and the sibling's own pin —
  # the two packages compile into one artifact, so they cannot disagree about
  # the compiler. A drift *below* the floor is not silently possible: Zig itself
  # refuses to build a package whose declared minimum is above the compiler in
  # hand, so this value can only ever be deliberately ahead of the floor.
  ZIG_VERSION: 0.16.0
  # Every binding is a subprocess transport over the built binary rather than a
  # linked archive, and each resolves `$GIST_BIN` before anything else. This is
  # the one place gist's CI is shaped differently from the substrate's, where
  # the bindings link a vendored archive and need no toolchain at all: here all
  # three suites need a real `zig build` first, and the Go suite fails rather
  # than skips without one.
  GIST_BIN: ${{ github.workspace }}/gist/zig-out/bin/gist

jobs:
  engine:
    name: engine (${{ matrix.os }})
    # Both host families, because the build branches on them: macOS re-archives
    # through `libtool` for ld64's alignment rules, and the resident tier's Unix
    # sockets behave differently enough to be worth exercising on each.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: gist
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: gist
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: The-Billy-Company/irregex
          path: irregex
          token: ${{ secrets.ECOSYSTEM_TOKEN || github.token }}
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # Compile-only first: when this fails, the test log below is noise, and
      # the failure is one line rather than a suite's worth of scrollback.
      - run: zig build check
      - run: zig build test
      # ripgrep is this gate's oracle, and the gate exits 1 without it rather
      # than skipping — a parity gate that skips has stopped gating.
      - name: install the parity oracle
        run: |
          command -v rg && exit 0
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ripgrep;
          else sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep; fi
      # The one conformance gate that runs per-push on both hosts. It earns that
      # by being hermetic (it synthesizes its corpus, so it cannot go vacuous or
      # depend on what a checkout happens to contain) and by finishing in under
      # a second on a built tree. The claim it holds is one a unit test cannot:
      # that a flag's ALGEBRA matches ripgrep's over a real walk. It exists
      # because a `--type-add` type selected with `-t` was silently cancelling
      # every other `-t` on the line, which nothing in `zig build test` saw.
      # The gate below shells `zig build -Doptimize=ReleaseFast` in this package,
      # and that install step copies `../irregex/zig-out/lib/libirgx.a`. `check`
      # and `test` above never install, which is why this is the first step in
      # the job that needs the sibling on disk rather than merely resolvable.
      - name: zig build (the sibling substrate)
        run: zig build -Doptimize=ReleaseFast
        working-directory: irregex
      - name: -t union parity (every type on the line reaches the answer)
        run: ./bench/conformance/gates/parity/type_union_parity.sh

  python:
    name: python (${{ matrix.python }})
    # 3.12 is the declared floor and is load-bearing (PEP 695 syntax reaches
    # this package through the substrate it imports), so it is tested rather
    # than assumed. There is no upper pin: a published library has no business
    # refusing next year's interpreter, and the way to keep that true is to
    # notice when it breaks.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: gist
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: The-Billy-Company/irregex
          path: irregex
          token: ${{ secrets.ECOSYSTEM_TOKEN || github.token }}
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      # ripgrep is the oracle for the parity tests, not a convenience: without
      # it on PATH they take their documented skip branch, and a parity gate
      # that skips is a parity gate that has stopped gating. The corpus those
      # tests build is a handful of files and three patterns, so the comparison
      # does not turn on which rg release the image happens to carry.
      - name: install the parity oracle
        run: command -v rg || { sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep; }
      # The product's own libraries, and the substrate's from ITS checkout.
      # `tests/test_packaging.py` stages `libgist` and `libirgx` side by side
      # and opens the product in a clean child process — the gate on the
      # loader-relative rpath — and it looks for the substrate under the sibling
      # checkout's `zig-out`, not the copy this build installs into ours. So
      # both builds are required for that assertion to run at all.
      # The sibling FIRST, and the order is load-bearing rather than tidy: this
      # package's install step copies `../irregex/zig-out/lib/libirgx.a` into its
      # own prefix, so building gist against an unbuilt sibling fails on that
      # copy. It was written the other way round and could only ever have worked
      # on a machine where someone had already built irregex by hand.
      - name: zig build (the sibling substrate)
        run: zig build
        working-directory: irregex
      - name: zig build (this package)
        run: zig build
        working-directory: gist
      # `-rs` and the grep, because every skip in this suite is conditioned on a
      # binary or library resolving, and a loader miss returns nothing rather than
      # erroring. That makes a broken build indistinguishable from a passing run:
      # the tier's tests simply stop existing and the job stays green. Both zig
      # builds and the oracle above are steps precisely so nothing here has a
      # reason to skip — so if something does, the environment is wrong, not
      # optional.
      - name: pytest, and prove nothing skipped itself
        working-directory: gist/bindings/python
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          set -o pipefail
          uv run --python "$PYTHON_VERSION" pytest -q -rs 2>&1 | tee "$RUNNER_TEMP/pytest.log"
          if grep -qE '^SKIPPED|[0-9]+ skipped' "$RUNNER_TEMP/pytest.log"; then
            echo "::error::a test skipped itself — a library or binary did not resolve"
            exit 1
          fi

  go:
    name: go
    # A Zig step, unlike the substrate's Go job: that module carries a prebuilt
    # archive per platform so `go get` needs no toolchain, and installing Zig
    # there would test a path consumers never take. This module is the opposite
    # shape — pure Go with no cgo, answering every verb by running the
    # certified binary — so the binary IS the dependency, and `engine_test.go`
    # deliberately fails rather than skips when it is absent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: gist
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: The-Billy-Company/irregex
          path: irregex
          token: ${{ secrets.ECOSYSTEM_TOKEN || github.token }}
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Workspace-relative on purpose: this input is read by the action, not
          # by a shell, so it does not follow a step's working directory.
          go-version-file: gist/bindings/go/go.mod
      # The sibling first — gist's install step copies its `libirgx.a`. See the
      # python job for why the order is load-bearing.
      - name: zig build (the sibling substrate)
        run: zig build
        working-directory: irregex
      - name: zig build
        run: zig build
        working-directory: gist
      - run: go vet ./...
        working-directory: gist/bindings/go
      # Here rather than in `discipline`, which states it needs no ../irregex and
      # means it — but golangci-lint typechecks, and this module's `go.mod`
      # replaces the substrate with `../../../irregex/bindings/go`. Linting it from
      # a lone checkout fails on the replacement directory, not on any Go it was
      # asked to judge. This job already has both checkouts and the toolchain.
      - name: Go binding
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.12.2
          # Workspace-relative: read by the action, not by a shell.
          working-directory: gist/bindings/go
      # Exactly one test here skips, and it is the only skip this job can
      # legitimately print: `TestAtlasReportsEveryArtifact` reads
      # `relate status --json`, so relate is not merely the producer of the
      # artifacts under test but of the readiness document itself.
      #
      # relate could be cloned here — it is public — and this job still does not,
      # because relate is not below gist. irregex is the substrate both stand on;
      # they are siblings, and a gate that builds its sibling to judge itself is
      # how two packages stop being separately releasable. The assertion is not
      # conceded either: it runs for real in relate's CI, which builds both and
      # drives this suite with `RELATE_BIN` set, so the pair is proven where the
      # pairing is the subject.
      #
      # Every other missing-binary arm in this module is fatal, because they all
      # resolve `gist` — which this job builds two steps up, so a miss there is a
      # broken environment rather than an absent capability.
      - run: go test ./...
        working-directory: gist/bindings/go

  rust:
    name: rust
    # Same reasoning as Go: the default feature set links no archive and drives
    # the certified binary, so `zig build` is what makes the suite non-vacuous.
    # The opt-in `native` feature is the graduation rung and is not this gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: gist
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: The-Billy-Company/irregex
          path: irregex
          token: ${{ secrets.ECOSYSTEM_TOKEN || github.token }}
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: install the parity oracle
        run: command -v rg || { sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep; }
      # The sibling first — gist's install step copies its `libirgx.a`. See the
      # python job for why the order is load-bearing.
      - name: zig build (the sibling substrate)
        run: zig build
        working-directory: irregex
      - name: zig build
        run: zig build
        working-directory: gist
      # rust-toolchain.toml pins the channel; installing it explicitly would
      # override the pin the repository already made.
      - run: rustup show
        working-directory: gist/bindings/rust
      - run: cargo fmt --check
        working-directory: gist/bindings/rust
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: gist/bindings/rust
      - run: cargo test
        working-directory: gist/bindings/rust
      # A prebuilt binary rather than the Docker action, which takes a
      # repo-root-relative manifest path and would have to be told about a
      # layout that differs in every one of these repositories. This is a
      # plain step, so it inherits the working directory and the toolchain
      # rustup already resolved above.
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-deny@0.19.0
      # deny.toml has been checked in the whole time with nothing running it.
      # `check` is all four: a RustSec advisory against anything in the graph,
      # the banned crates that would mean this binding grew a TLS stack or an
      # async runtime, the license allowlist, and the registries a crate may
      # come from.
      - run: cargo deny check
        working-directory: gist/bindings/rust

  discipline:
    name: discipline
    # Prose, manifests, scripts, and binding hygiene are one kind of news: the
    # repository's authored surface stopped obeying its checked-in contracts.
    # This stays separate from every build job because none of these checks
    # needs ../irregex or a gist binary; cloning and compiling the ecosystem
    # would spend minutes without making the verdict any stronger.
    #
    # Python-distributed tools run through uv's isolated no-project environment,
    # ShellCheck included: it used to come with the runner, and an image carrying
    # an older build reported SC2317 against a `trap`-invoked cleanup that newer
    # ShellCheck understands. An unpinned linter turns an image bump into a
    # verdict, so it is pinned like every other tool here. Hosted tool actions and
    # the cache use verified SHA pins. Dependabot watches every pin each Monday.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Markdown structure and layout
        uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # v24.1.0
        with:
          globs: "**/*.md"
      - name: Restore link-check cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lycheecache
          key: lychee-${{ runner.os }}-${{ hashFiles('**/*.md') }}
          restore-keys: lychee-${{ runner.os }}-
      - name: Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --config lychee.toml --no-progress '**/*.md'
          fail: true
      - name: Authored spelling
        uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1.48.0
      - name: YAML structure
        run: uv run --no-project --with yamllint==1.38.0 yamllint .github
      - name: TOML format and schemas
        run: |
          uv run --no-project --with taplo==0.9.3 taplo fmt --check
          uv run --no-project --with taplo==0.9.3 taplo lint
      - name: EditorConfig conformance
        run: uv run --no-project --with editorconfig-checker==3.8.0 ec
      - name: Python lint and format
        run: |
          uv run --no-project --with ruff==0.16.1 ruff check .
          uv run --no-project --with ruff==0.16.1 ruff format --check .
      - name: Shell correctness
        run: git ls-files -z '*.sh' | xargs -0 uv run --no-project --with shellcheck-py==0.11.0.1 shellcheck
      # Run this last so the workflow audits the exact file CI just interpreted,
      # including every action and permission introduced by this job itself.
      - name: GitHub Actions security
        run: uv run --no-project --with zizmor==1.29.0 zizmor --pedantic --no-online-audits --strict-collection .github

  fmt:
    name: fmt
    # Zig was the one language here whose formatter nothing checked, while Rust
    # got `cargo fmt --check` in the job above. That gap is not academic: `zig
    # fmt` pads a column-aligned multiline literal into a grid, so a rename that
    # shrinks the widest cell leaves every row beneath it one space too wide, in
    # files nobody touched. Drift like that wants a red X that says "formatting",
    # not one buried in a build log.
    #
    # Its own job for the same reason the other four are separate. Folding it
    # into `engine` would run it twice for a verdict that cannot differ by host;
    # folding it into `rust` would hide a Zig result inside a Rust job.
    #
    # The one job here with a bare checkout and no `working-directory`. Every
    # other job in this file pays for the sibling path dependency described at
    # the top of the file, because every other job configures a build; this one
    # reads files and never asks Zig to resolve `irregex` at all. Giving it the
    # two-checkout preamble anyway would spend a clone to make a job look like
    # its neighbours. It also means `git ls-files` below means THIS repository
    # rather than whichever checkout landed at the workspace root.
    #
    # Pinned to the ZIG_VERSION everything else builds with, because the
    # formatter's output is a property of the compiler release — checking against
    # a different Zig would be checking against a different grid.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: zig fmt --check
        run: |
          set -euo pipefail
          # Enumerated rather than spelled out as a path list, because a path
          # list drifts the same silent way the formatting does — it goes stale
          # the moment a directory is added or renamed, and stale in the
          # direction that checks less. This package is a live demonstration of
          # both halves: `tools/` looks like it would hold Zig and holds only
          # Python, while `build.zig` sits at the root, so the obvious
          # hand-written `src/ bench/` would check neither.
          #
          # Tracked plus untracked-not-ignored is every Zig file this repository
          # owns. What that leaves out is exactly the ignored trees — `zig-out/`,
          # `.zig-cache/`, and the fetched `zig-pkg/`, which parks a whole
          # `build.zig` of its own — so the exclusions are named in `.gitignore`
          # and reviewable there, rather than being whatever happened to fall
          # outside an argument list.
          #
          # The existence test is for a working tree mid-edit, where the index
          # can still name a file someone has deleted; CI's checkout never has
          # one, and a stale index should not read as a formatting failure.
          files=()
          while IFS= read -r f; do
            if [ -f "$f" ]; then files+=("$f"); fi
          done < <(git ls-files -co --exclude-standard '*.zig')
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::found no .zig files — the enumeration is broken, not the tree" >&2
            exit 1
          fi
          echo "checking ${#files[@]} files"
          zig fmt --check "${files[@]}"

  certificate:
    name: certificate
    # The certificate machinery — the mint ledger, the cross-machine release
    # gate, and the report post-processors — is Python, and nothing was running
    # its tests. That is the subsystem that decides whether a published
    # dominance claim is well-formed, so a silent break in it does not surface
    # until a mint, which is exactly when nobody wants to be debugging it.
    #
    # A bare checkout, no Zig, and no sibling, for a reason worth stating plainly
    # because it is the thing most likely to be "fixed" later into something
    # slower: none of these tests build or drive a gist binary. They are hermetic
    # by construction — every certificate, bundle, and residual record is
    # synthesized into a tmpdir — and their own docstrings say so. Adding a
    # `zig build` here would buy nothing and cost the ecosystem checkout.
    #
    # It also means the job does not depend on minted artifacts, which matters
    # right now: the published bundles under `bench/certificate/artifact/` were
    # purged and gitignored because they had been minted over a corpus that is
    # not public. The machinery is intact and the tests never wanted the
    # artifacts; this job is the standing proof of that separation.
    #
    # Stdlib-only Python by design, so uv is here to pin an interpreter rather
    # than to install anything: `--no-project` keeps it from discovering
    # `bindings/python`'s pyproject and building a wheel this job has no use for.
    # 3.12 is the floor the rest of the repository declares.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      # Enumerated, not listed, for the same reason the formatter's file set is:
      # a written-down list of suites silently stops covering the one added next
      # week. Every suite here is a plain `unittest.main()` script, so running it
      # as `python <path>` is enough — Python puts the script's own directory on
      # `sys.path`, which is how each one resolves the module it is testing.
      #
      # One suite reaches outside this subtree, and it is worth knowing before
      # reading a red X: `report/test_scanner_residual.py` puts
      # `bench/conformance/rgsuite/` on `sys.path` and drives `fuzz._klass` to
      # prove every residual class the harness can emit has prose in the
      # reporter. That coupling is the test's whole point — the vocabulary has
      # two owners and drift between them is otherwise silent — but it does mean
      # a change to the fuzz harness can fail this job. When that happens the
      # answer is to reconcile the two, not to drop the suite from the glob.
      - name: certificate and ledger suites
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(bench/certificate/*/test_*.py)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "::error::found no certificate suites — the enumeration is broken, not the tree" >&2
            exit 1
          fi
          echo "running ${#tests[@]} suites"
          for t in "${tests[@]}"; do
            echo "── $t"
            uv run --no-project --python 3.12 python "$t"
          done
      # A suite proves the behaviour it covers; this proves the modules it does
      # NOT reach. Some are covered transitively and need no help — `test_release`
      # imports `release`, which imports `artifacts`, which imports `layers`, so
      # a broken import in any of those three already fails the step above. What
      # nothing reaches is `ratio.py` and the nine report post-processors
      # (`codex`, `indexq`, `multipattern`, `portable`, `rank`, `relate`, `scale`,
      # `stats`, `warm`): a bad import or a syntax error in one of those would sit
      # undetected until a mint shelled it, which is the worst moment to find out.
      # Importing is the cheapest assertion that the whole subsystem is still
      # loadable, and it is enumerated so a new module joins the gate by existing.
      - name: every certificate module still imports
        run: |
          set -euo pipefail
          uv run --no-project --python 3.12 python - <<'PY'
          import importlib, pathlib, sys

          root = pathlib.Path("bench/certificate")
          modules = sorted(
              p for p in root.glob("*/*.py") if not p.name.startswith("test_")
          )
          if not modules:
              sys.exit("found no certificate modules — the enumeration is broken, not the tree")
          for path in modules:
              # Each module is a script that imports its siblings by bare name,
              # so its own directory is the import root — the same resolution a
              # `python <script>` run gets for free.
              sys.path.insert(0, str(path.parent))
              importlib.import_module(path.stem)
              sys.path.pop(0)
              print(f"  ok  {path}")
          print(f"{len(modules)} modules import cleanly")
          PY

  topology:
    # `contract/gist.zone` declares this package's import topology - the zone
    # stack, the sealed deep modules, the guest lists, the reach ceiling, the
    # cycle ban - and until this job existed, nothing read it. Zig has no
    # visibility rules between files inside a package and its analysis is lazy
    # enough that a genuine import cycle still compiles, so every boundary the
    # READMEs describe was convention with nothing standing behind it. A
    # declaration nobody enforces is a comment.
    #
    # Pinned like every other tool in this file, and installed the same way, so
    # this job's verdict moves when we move it. No Zig and no build: zoning reads
    # the tree, not a build graph, so it is one of the fastest jobs here.
    name: topology
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      # The fix is in the code, or in a `variance ... because "..."` that says
      # what would retire it - never in quietly widening the contract to match
      # what the imports happen to do today.
      - name: Import topology
        run: uv run --no-project --with zoning==0.2.0 zoning verify --complete

  version:
    name: version
    # One number lives in `build.zig.zon`; the publishing manifests that cannot
    # import it — Cargo and PyPI — carry a marked copy the release bot rewrites.
    # This asks whether those copies still agree, and whether the bot has been
    # told about every one of them. A mirror the config forgot is the
    # interesting failure: nothing breaks until a release ships a package
    # claiming last version's number.
    #
    # Stdlib-only, no Zig and no build — it reads lines.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv run --no-project --python 3.12 python tools/version_parity.py

      # Every index this project publishes to shows the repository README as the
      # project's page, and each one resolves a relative link against its own
      # URL rather than against GitHub. `registry_readme.py` corrects that at
      # package time; this proves, on every commit, that it still can — a link
      # to a file somebody moved fails here rather than at the release, or worse,
      # as a well-formed URL on a published page pointing at nothing.
      - run: uv run --no-project --python 3.12 python tools/registry_readme.py --check

  changelog:
    name: changelog
    # Neither repository had anything checking its news fragments, and the
    # failure mode is quiet by construction: `towncrier build --draft` will
    # cheerfully render a clean changelog while silently dropping any file whose
    # name it does not recognize. A fragment typed `.fixd.md` instead of
    # `.fixed.md` is not an error to towncrier — it is simply not a fragment, so
    # it renders nothing, exits 0, and stays invisible until someone notices the
    # entry missing from a release.
    #
    # So `--draft` on its own is NOT the gate, and adding it alone would have
    # been a green tick over exactly the defect it was supposed to catch. The
    # strictness comes from `ignore` in `towncrier.toml`: setting that key (even
    # to an empty list) flips towncrier from skipping unparseable filenames to
    # failing on them, with a message naming the file. That puts the fragment
    # grammar in towncrier's hands rather than in a bespoke filename parser here
    # — the same reason the formatter's file set comes from `git ls-files`
    # instead of a path list. There is no second spelling to keep in sync, and a
    # contributor running `towncrier build --draft` locally now gets the same
    # error CI does.
    #
    # `towncrier check` is deliberately not what this runs: that verb asks
    # whether a branch ADDED a fragment, which is a contribution policy. This
    # job only asks whether the fragments that exist are well-formed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: every fragment is one towncrier recognizes
        run: |
          set -euo pipefail
          # The version is a placeholder — `--draft` writes nothing, and the
          # number only shows up in the heading it renders to stdout.
          draft=$(uv run --no-project --with towncrier==25.8.0 towncrier build --draft --version 0.0.0)
          printf '%s\n' "$draft"
          # The vacuous-green guard, in the same spirit as the formatter's "found
          # no .zig files". A misconfigured `directory`, or a fragment directory
          # towncrier cannot read, renders "No significant changes." and exits 0
          # — a passing gate over nothing. Conditioning on fragments actually
          # being present on disk keeps this honest right after a release, when
          # an empty `changelog.d` and an empty draft are the correct answer.
          # `README.md` is the one non-fragment `.md` the convention allows, and
          # it is in the `ignore` list for that reason.
          fragments=$(find changelog.d -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          echo "changelog.d holds ${fragments} fragment(s)"
          if [ "$fragments" -gt 0 ] && printf '%s' "$draft" | grep -q 'No significant changes'; then
            echo "::error::${fragments} fragments on disk but towncrier rendered none — the wiring is broken, not the tree" >&2
            exit 1
          fi

  release-ready:
    # The one check `release.yml`'s preflight polls for on the exact tagged
    # commit (`release.toml`'s `[ci].required_check`). Everything above feeds
    # into it, so a red job blocks the tag rather than the publish workflow
    # discovering it minutes into a wheel build. `if: always()` is required —
    # the default `if` on a job would skip this one the moment anything
    # upstream failed, which is exactly the case it has to report on.
    if: always()
    needs: [engine, python, go, rust, discipline, fmt, certificate, topology, version, changelog]
    runs-on: ubuntu-latest
    steps:
      - name: every required job is green
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 -c "
          import json, os
          needs = json.loads(os.environ['NEEDS'])
          failed = sorted(name for name, info in needs.items() if info['result'] != 'success')
          if failed:
              raise SystemExit(f'not release-ready: {failed} did not succeed')
          print(f'release-ready: {len(needs)} required jobs all succeeded')
          "
