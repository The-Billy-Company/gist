# Automated dependency updates.
#
# Five manifests, four package ecosystems, one weekly window. The bindings keep
# a sibling path to irregex for local work, but their registry versions and
# third-party edges still deserve updates here. Zig stays manual because
# Dependabot has no Zig ecosystem and its lone dependency is that sibling.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    labels: ["type/deps", "area/ci"]
    cooldown:
      default-days: 7

  - package-ecosystem: cargo
    directory: /bindings/rust
    schedule:
      interval: weekly
      day: monday
    groups:
      rust:
        patterns: ["*"]
    commit-message:
      prefix: "build"
    labels: ["type/deps", "area/bindings", "lang/rust"]
    cooldown:
      default-days: 7

  # This pin is the compiler CI actually runs, not a second Rust dependency.
  - package-ecosystem: rust-toolchain
    directory: /bindings/rust
    schedule:
      interval: monthly
    commit-message:
      prefix: "build"
    labels: ["type/deps", "area/bindings", "lang/rust"]
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    directory: /bindings/go
    schedule:
      interval: weekly
      day: monday
    groups:
      go:
        patterns: ["*"]
    commit-message:
      prefix: "build"
    labels: ["type/deps", "area/bindings", "lang/go"]
    cooldown:
      default-days: 7

  - package-ecosystem: uv
    directory: /bindings/python
    schedule:
      interval: weekly
      day: monday
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "build"
    labels: ["type/deps", "area/bindings", "lang/python"]
    cooldown:
      default-days: 7
