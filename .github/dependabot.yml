# Automated dependency updates.
#
# One ecosystem, and the omissions are the interesting part.
#
# The three bindings each resolve the engine as a SIBLING PATH dependency - the
# Go `replace`, the uv source, and the Rust path dep all spell
# `../../../irregex/...`. Dependabot runs each update in a sandbox holding only
# this repository, where that path does not exist, so a `cargo` / `gomod` / `uv`
# entry here would not produce careful pull requests: it would produce a
# recurring resolution error against a manifest that is correct. The bindings'
# real third-party surface is small and deliberate (serde, pytest, tempfile),
# and it moves when the engine's does - which Dependabot DOES watch, in the
# repository that can actually resolve it.
#
# Zig is absent because Dependabot has no Zig ecosystem, and because this
# package's only dependency is that same sibling.
#
# That leaves the one thing here nothing else watches, and the one most worth
# watching: a compromised action is the supply-chain hole that runs with the
# repository's own token.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "ci"]
