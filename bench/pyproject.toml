# Ruff config for gist bench Python helpers (certify / rgsuite / reports).
# Extends the monorepo root; only per-tree divergences live here.
[tool.ruff]
extend = "../../../../pyproject.toml"

# Bench / differential harnesses shell trusted local binaries (`rg`, built
# `gist`, hyperfine) — same S603 posture as shipkit / ci/internal. Macro
# certify uses a seeded `random.Random` for bootstrap CIs (S311) — not crypto.
[tool.ruff.lint.extend-per-file-ignores]
"rgsuite/*.py" = [ "S603" ]
"certify/*.py" = [ "S311" ]
