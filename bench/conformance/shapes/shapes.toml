expect = "win"
dims = { mode = "linear", flags = "fixed", scope = "rootless", emit = "lines", select = "rare", kind = "literal" }

[[shape]]
id = "literal-rare-only-matching"
pattern = "WalletService"
gist = [ "-F", "-o" ]
rg = [ "-F", "-o" ]
bar = "lines"
expect = "win"
dims = { mode = "linear", flags = "only-matching", scope = "rootless", emit = "lines", select = "rare", kind = "literal" }

[[shape]]
id = "word-common-files"
pattern = "ctx"
gist = [ "-w", "-l" ]
rg = [ "-w", "-l" ]
bar = "set"
expect = "win"
