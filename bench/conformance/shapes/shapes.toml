# gist CLI-shape admission matrix.
#
# One machine-readable row per SUPPORTED CLI shape gist claims, spanning the
# dimensions a locator's behavior actually turns on: `mode` (linear / -U / -P),
# match `flags`, walk `scope`, `emit` shape, `select`ivity, and pattern `kind`.
# `matrix.py` lowers each row into a REAL argv it drives through three paths —
# gist cold-indexed, gist cold-unindexed (`--no-index`), and ripgrep — so
# eligibility and index-elision are MEASURED, never inferred:
#
#   * `matrix.py parity`  asserts gist-idx == gist-noidx == rg at each row's `bar`
#                         (set / lines / count / exit). This is the parity-first
#                         gate — a shape that diverges never earns a perf verdict.
#   * `matrix.py bench`   times gist-idx vs rg with the SAME bootstrap-CI +
#                         Mann-Whitney machinery the certificate uses
#                         (`certify/certify_stats.py`), one fail-closed verdict
#                         per row, and (with --publish) refreshes matrix_baseline.json.
#   * `matrix.py gate`    asserts the committed per-shape floors, with one honest
#                         asymmetry: a row DECLARED `expect="loss"` is report-only
#                         (a declared hole lives in its own row on purpose, so an
#                         aggregate can never bury it — currently none: every
#                         shape is a declared win), while any
#                         `expect="win"`/`"parity"` row regressing below its floor
#                         is a hard failure.
#
# Patterns are chosen for known corpus selectivity (rare = one service symbol,
# common = a ubiquitous keyword) so the selectivity dimension is real, not a label.
# Roots default to the six host source roots (mirrors corpus.resolveRoots and
# _compete.sh); a row may override `roots` to exercise a bounded subtree.
#
# ONE WORD OF WARNING ABOUT `select`, PAID FOR IN A REAL DEFECT
# -------------------------------------------------------------
# `select` used to mean only "how many true matches does this pattern have" —
# `rare` = few, `common` = many. That collapses TWO independent costs into one
# label, and the collapse hid a live bug for months: the literal kernel picks two
# byte offsets of the needle to filter 64-byte blocks on, and its selection
# COLLAPSED to the adjacent pair (0,1) for any needle whose bytes all had equal
# corpus rarity — which is most lowercase identifiers. Cost: 18.1 GB/s literal
# scan where 35.5 GB/s was achievable on code (13.1 vs 33.4 GB/s on prose).
#
# Every literal row in this file was `rare` or `common`, so neither the failure
# nor its absence could be read off the table:
#   * the "rare literal" class was represented by `pgxpool` alone — a LUCKY
#     needle, because `pg` is a genuinely rare digraph, so it selects a good pair
#     and looks fast. The class's best case stood in for the class.
#   * the degenerate needles WERE in the suite (`error`, `func`) but wore the
#     label `common`, so their slowness was charged to having many true matches
#     rather than to the prefilter failing.
#
# So `select` now names the PREFILTER's signal, not the match count:
#   selective    the needle carries a discriminating rare byte → a healthy
#                selector finds a good offset pair. `pgxpool` (rare `pg`).
#   degenerate   every byte is equally common → a marginal-rarity selector has
#                NO signal to work with. This is where the kernel fails.
#   rare/common  legacy match-volume labels, kept so committed floors keyed on
#                these ids stay readable.
# A degenerate row with FEW true matches is the load-bearing one: slowness there
# can ONLY mean the prefilter failed, because there is no real work to blame.

default_roots = [ "services", "libs", "clients", "contracts", "scripts", "quality" ]

# ─────────────────────────── mode: linear default ───────────────────────────

[[shape]]
id = "literal-rare-files"
pattern = "WalletService"
gist = [ "-F", "-l" ]
rg = [ "-F", "-l" ]
bar = "set"
expect = "win"
dims = { mode = "linear", flags = "fixed", scope = "rootless", emit = "files", select = "rare", kind = "literal" }

# WHAT THIS ROW ACTUALLY MEASURES (the id is load-bearing — committed floors in
# baseline.json / shapes.csv key on it, so it is NOT renamed): `error` is not just
# common, it is DEGENERATE — e,r,r,o,r are all high-frequency bytes, so a
# marginal-rarity offset selector has no signal and collapses to the adjacent pair
# (0,1). This row therefore charges TWO costs to one number: many true matches AND
# a failed prefilter. Historically its slowness was read as the former, which is
# exactly how the selector-collapse defect stayed hidden. Read it together with
# `literal-degenerate-files` (few matches, same tie condition) — that row isolates
# the prefilter, this one does not and never could.
[[shape]]
id = "literal-common-files"
pattern = "error"
gist = [ "-F", "-l" ]
rg = [ "-F", "-l" ]
bar = "set"
expect = "win"
dims = { mode = "linear", flags = "fixed", scope = "rootless", emit = "files", select = "common", kind = "literal" }

[[shape]]
id = "literal-rare-count"
pattern = "WalletService"
gist = [ "-F", "-c" ]
rg = [ "-F", "-c" ]
bar = "count"
expect = "win"
dims = { mode = "linear", flags = "fixed", scope = "rootless", emit = "count", select = "rare", kind = "literal" }

[[shape]]
