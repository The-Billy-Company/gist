# Neovim embeds LuaJIT 2.1, so the plugin checks against Lua 5.1 plus the
# editor surface declared in `nvim.yml`. That keeps `require` available while
# making misspelled `vim.health` and `vim.fn` calls real lint failures.

std = "lua51+nvim"

[lints]
# A plugin health check is the one place a global read is the point: it
# asks the editor what it is before reporting. Everything else here is local.
global_usage = "allow"

[config]
unused_variable = { allow_unused_self = true, ignore_pattern = "^_" }
